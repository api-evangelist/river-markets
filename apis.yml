aid: river-markets
name: River Markets
description: >-
  River Markets is a unified prime brokerage for prediction markets, consolidating multiple
  exchanges — Kalshi, Polymarket, and Polymarket US (with Novig and Rothera planned) — behind a
  single account, order-management system, and REST + WebSocket API. Every contract across all
  venues is assigned a unified River ID, so professional and institutional traders can search
  markets, place and route orders (including icebergs, pegs, stop-losses, and take-profits with
  smart order routing), track positions and P&L across isolated subaccounts, and stream live
  fills, orderbooks, orders, and trade prints from one integration. Requests are Ed25519-signed
  so the private key never leaves the client process. Founded by ex-BlackRock and high-frequency
  trading quants and backed by Y Combinator (Spring 2026).
