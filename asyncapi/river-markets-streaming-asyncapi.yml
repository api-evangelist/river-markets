      order:
        $ref: '#/components/messages/serverEvent'
  tradeprints:
    address: /v1/ws/tradeprints
    description: Live trade tape (every print) for one or more markets (subscribe by river_ids).
    messages:
      subscribe:
        $ref: '#/components/messages/subscribeRiverIds'
      print:
        $ref: '#/components/messages/serverEvent'
